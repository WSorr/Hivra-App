[package]
name = "hivra-transport"
version = "1.0.0"
edition = "2021"
authors = ["Hivra Team"]
license.workspace = true
description = "Transport layer for Hivra"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
nostr-sdk = "0.45.4"
nostr = { version = "0.45.5", default-features = false, features = ["nip44"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wincode = { version = "=0.6.3", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[dev-dependencies]
nostr-sdk = { version = "0.45.4", features = ["local-relay"] }

[features]
default = ["std"]
std = []
