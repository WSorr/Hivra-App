name: Hivra Repository Gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  review-gates:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shell gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          python3 -m pip install 'jsonschema==4.25.1'

      - name: Verify repository toolchain pins
        run: |
          bash tools/toolchain/verify_environment.sh --self-test
          bash tools/toolchain/verify_environment.sh --static

      - name: Install pinned Dart SDK
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: 3.13.3

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Test platform-neutral Rust workspace
        run: cargo test --workspace --exclude hivra-ffi --locked

      - name: Test standalone WASM FFI without Capsule dependencies
        run: cargo test -p hivra-ffi --no-default-features --locked

      - name: Analyze and test Flutter application
        working-directory: flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build canonical standalone workspace runner
        run: bash tools/release/workspace_runner.sh "$RUNNER_TEMP/workspace-runner"

      - name: Check exact runner shutdown and OOM recovery without network
        working-directory: flutter
        run: |
          stand="$RUNNER_TEMP/runner-shutdown"
          mkdir -p "$stand"
          tar -xzf "$RUNNER_TEMP/workspace-runner/hivra-workspace-runner-linux-x64.tar.gz" -C "$stand"
          dart build cli --target test/fixtures/plugin_workspace_headless_probe.dart --output "$RUNNER_TEMP/runner-probe"
          cp "$RUNNER_TEMP/runner-probe/bundle/bin/plugin_workspace_headless_probe" "$stand/bin/shutdown-probe"
          if [ -d "$RUNNER_TEMP/runner-probe/bundle/lib" ]; then
            cp -R "$RUNNER_TEMP/runner-probe/bundle/lib" "$stand/"
          fi
          sudo env PATH="$PATH" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" RUSTUP_TOOLCHAIN=1.93.0 \
            unshare --net "$stand/bin/shutdown-probe" --runner-shutdown \
              "$stand/bin/hivra-workspace-runner" \
              "$PWD/test/fixtures/plugin_workspace_memory_probe.py" \
              "$stand/hivra-workspace-runner.service"

      - name: Review gates
        run: bash tools/review/review_all.sh

      - name: Verify review gates preserve clean checkout
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi

      - name: Manual signoff checker self-test
        run: bash tools/release/check_manual_release_signoff.sh --self-test

      - name: Release artifact binding self-test
        run: bash tools/release/publish_github_release.sh --self-test

      - name: Retain verified standalone runner candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-runner-linux-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workspace-runner/hivra-workspace-runner-linux-x64.tar.gz
            ${{ runner.temp }}/workspace-runner/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
